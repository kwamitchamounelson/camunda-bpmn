server:
  port: 8080

spring:
  application:
    name: livraison-process
  datasource:
    # Base fichier : l'historique des instances survit aux redemarrages,
    # indispensable pour explorer Cockpit sereinement.
    # AUTO_SERVER=TRUE permet d'ouvrir la base depuis un client externe pendant
    # que l'appli tourne ; H2 2.x refuse de le combiner avec DB_CLOSE_ON_EXIT.
    url: jdbc:h2:file:./data/camunda-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
      firstName: Demo
      lastName: Admin
    filter:
      # Cree le filtre par defaut de la Tasklist, sinon elle apparait vide.
      create: Toutes les taches
    database:
      schema-update: true
    # Deploie les BPMN et les DMN presents dans les ressources
    deployment-resource-pattern: classpath*:bpmn/*.bpmn, classpath*:dmn/*.dmn
    history-level: full
    webapp:
      index-redirect-enabled: true

logging:
  level:
    com.formation.livraison: DEBUG
    org.camunda.bpm.engine.jobexecutor: WARN
