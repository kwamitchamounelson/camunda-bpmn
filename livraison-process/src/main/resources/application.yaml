server:
  port: 8080

spring:
  application:
    name: livraison-process
  datasource:
    # Base 100 % en memoire : rien n'est ecrit sur disque, tout disparait a l'arret.
    # C'est volontaire et necessaire ici : CommandeRepository est une map en memoire,
    # donc une base moteur persistante survivrait aux commandes et laisserait des
    # instances orphelines ("Commande introuvable") apres un redemarrage.
    # DB_CLOSE_DELAY=-1 garde la base vivante quand le pool ferme sa derniere
    # connexion ; sans lui H2 detruirait le schema en cours d'execution.
    url: jdbc:h2:mem:camunda-livraison;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
      firstName: Demo
      lastName: Admin
    filter:
      # Cree le filtre par defaut de la Tasklist, sinon elle apparait vide.
      create: Toutes les taches
    database:
      schema-update: true
    # Deploie les BPMN et les DMN presents dans les ressources
    deployment-resource-pattern: classpath*:bpmn/*.bpmn, classpath*:dmn/*.dmn
    history-level: full
    webapp:
      index-redirect-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
  # Limite la doc a l'API metier : evite d'exposer les endpoints techniques
  # eventuellement apportes par les webapps Camunda.
  paths-to-match: /api/**

logging:
  level:
    com.formation.livraison: DEBUG
    com.formation.pret: DEBUG
    org.camunda.bpm.engine.jobexecutor: WARN
