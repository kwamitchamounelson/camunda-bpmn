spring:
  datasource:
    url: jdbc:h2:mem:camunda-pret-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    database:
      schema-update: true
    deployment-resource-pattern: classpath*:bpmn/*.bpmn, classpath*:dmn/*.dmn
    history-level: full
    job-execution:
      # Pas de job executor en test : les timers sont declenches a la main.
      enabled: false
